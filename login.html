<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 登入 - 炸麥工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/auth.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background: #0a0a0a; font-family: 'Inter', 'Noto Sans TC', sans-serif; color: #eee; }
        .glass {
            background: rgba(10, 10, 20, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 13, 13, 0.2);
            border-radius: 1.5rem;
        }
        .input-field {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            width: 100%;
            outline: none;
        }
        .input-field:focus {
            border-color: #ff0d0d;
            box-shadow: 0 0 20px rgba(255, 13, 13, 0.15);
        }
        .login-btn {
            background: linear-gradient(135deg, #ff0d0d, #8b0000);
            transition: all 0.2s;
        }
        .login-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(255, 13, 13, 0.4);
        }
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(transparent 50%, rgba(255, 13, 13, 0.03) 50%);
            background-size: 100% 6px;
            pointer-events: none;
            z-index: 999;
            animation: scan 12s linear infinite;
        }
        @keyframes scan {
            0% { background-position: 0 0; }
            100% { background-position: 0 1000px; }
        }
    </style>
</head>
<body>

<div class="scanline"></div>

<div class="min-h-screen flex items-center justify-center p-4">
    <div class="glass p-8 w-full max-w-md">

        <div class="text-center mb-8">
            <div class="text-5xl mb-3">💀</div>
            <h1 class="text-3xl font-bold text-red-500">登入</h1>
            <p class="text-gray-400 text-sm mt-1">登入你的炸麥帳號</p>
        </div>

        <!-- 訊息顯示 -->
        <div id="message" class="hidden p-3 rounded-lg mb-4 text-sm"></div>

        <!-- 登入後自動跳轉 -->
        <script>
            if (isLoggedIn()) {
                window.location.href = 'dashboard.html';
            }
        </script>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-4">
                <label class="block text-gray-300 text-sm mb-2">👤 帳號</label>
                <input type="text" id="username" class="input-field" placeholder="請輸入帳號" required>
            </div>

            <div class="mb-6">
                <label class="block text-gray-300 text-sm mb-2">🔒 密碼</label>
                <input type="password" id="password" class="input-field" placeholder="請輸入密碼" required>
            </div>

            <button type="submit" class="login-btn w-full py-3 rounded-xl font-bold text-white text-lg">
                🔓 登入
            </button>
        </form>

        <div class="text-center mt-6">
            <p class="text-gray-400 text-sm">還沒有帳號？ <a href="register.html" class="text-red-400 hover:underline">立即註冊</a></p>
        </div>

        <div class="text-center mt-4">
            <a href="index.html" class="text-gray-500 hover:text-gray-300 text-sm">← 返回首頁</a>
        </div>
    </div>
</div>

<script>
function handleLogin(event) {
    event.preventDefault();
    
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    
    const messageDiv = document.getElementById('message');
    
    if (!username || !password) {
        showMessage('⚠️ 請輸入帳號和密碼', 'warning');
        return;
    }
    
    const result = loginUser(username, password);
    
    if (result.success) {
        showMessage(result.message, 'success');
        setTimeout(() => {
            window.location.href = 'dashboard.html';
        }, 1000);
    } else {
        showMessage(result.message, 'danger');
        document.getElementById('password').value = '';
    }
}

function showMessage(msg, type) {
    const div = document.getElementById('message');
    div.textContent = msg;
    div.className = 'p-3 rounded-lg mb-4 text-sm ';
    
    if (type === 'success') {
        div.classList.add('bg-green-900/50', 'text-green-400', 'border', 'border-green-500/30');
    } else if (type === 'danger') {
        div.classList.add('bg-red-900/50', 'text-red-400', 'border', 'border-red-500/30');
    } else {
        div.classList.add('bg-blue-900/50', 'text-blue-400', 'border', 'border-blue-500/30');
    }
    
    div.classList.remove('hidden');
}
</script>

</body>
</html>
