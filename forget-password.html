<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔑 忘記密碼 - 炸麥工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/auth.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background: #0a0a0a; font-family: 'Inter', 'Noto Sans TC', sans-serif; color: #eee; }
        .glass {
            background: rgba(10, 10, 20, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 13, 13, 0.2);
            border-radius: 1.5rem;
        }
        .input-field {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            width: 100%;
            outline: none;
        }
        .input-field:focus {
            border-color: #ff0d0d;
            box-shadow: 0 0 20px rgba(255, 13, 13, 0.15);
        }
        .btn-primary {
            background: linear-gradient(135deg, #ff0d0d, #8b0000);
            transition: all 0.2s;
        }
        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(255, 13, 13, 0.4);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            transition: all 0.2s;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.2);
        }
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(transparent 50%, rgba(255, 13, 13, 0.03) 50%);
            background-size: 100% 6px;
            pointer-events: none;
            z-index: 999;
            animation: scan 12s linear infinite;
        }
        @keyframes scan {
            0% { background-position: 0 0; }
            100% { background-position: 0 1000px; }
        }
    </style>
</head>
<body>

<div class="scanline"></div>

<div class="min-h-screen flex items-center justify-center p-4">
    <div class="glass p-8 w-full max-w-md">

        <div class="text-center mb-8">
            <div class="text-5xl mb-3">🔑</div>
            <h1 class="text-3xl font-bold text-red-500">忘記密碼</h1>
            <p class="text-gray-400 text-sm mt-1">輸入你的註冊信箱，我們將寄送驗證碼</p>
        </div>

        <!-- 訊息顯示 -->
        <div id="message" class="hidden p-3 rounded-lg mb-4 text-sm"></div>

        <!-- 步驟 1：輸入信箱 -->
        <div id="step1">
            <form onsubmit="handleSendCode(event)">
                <div class="mb-6">
                    <label class="block text-gray-300 text-sm mb-2">📧 註冊信箱</label>
                    <input type="email" id="email" class="input-field" placeholder="example@gmail.com" required>
                </div>

                <button type="submit" class="btn-primary w-full py-3 rounded-xl font-bold text-white text-lg">
                    📤 寄送驗證碼
                </button>
            </form>
        </div>

        <!-- 步驟 2：輸入驗證碼 + 重設密碼 -->
        <div id="step2" class="hidden">
            <div class="mb-4">
                <label class="block text-gray-300 text-sm mb-2">🔢 驗證碼</label>
                <input type="text" id="code" class="input-field" placeholder="請輸入 6 位驗證碼" maxlength="6">
            </div>

            <div class="mb-6">
                <label class="block text-gray-300 text-sm mb-2">🔒 新密碼</label>
                <input type="password" id="new_password" class="input-field" placeholder="請輸入新密碼 (最少4字)" minlength="4">
            </div>

            <div class="flex gap-4">
                <button onclick="handleResetPassword()" class="btn-primary flex-1 py-3 rounded-xl font-bold text-white text-lg">
                    ✅ 重設密碼
                </button>
                <button onclick="backToStep1()" class="btn-secondary px-4 py-3 rounded-xl font-bold text-white text-lg">
                    ← 返回
                </button>
            </div>
        </div>

        <div class="text-center mt-6">
            <p class="text-gray-400 text-sm">回到 <a href="login.html" class="text-red-400 hover:underline">登入頁面</a></p>
        </div>

        <div class="text-center mt-4">
            <a href="index.html" class="text-gray-500 hover:text-gray-300 text-sm">← 返回首頁</a>
        </div>
    </div>
</div>

<script>
// 暫存信箱
let resetEmail = '';

function showMessage(msg, type) {
    const div = document.getElementById('message');
    div.textContent = msg;
    div.className = 'p-3 rounded-lg mb-4 text-sm ';
    
    if (type === 'success') {
        div.classList.add('bg-green-900/50', 'text-green-400', 'border', 'border-green-500/30');
    } else if (type === 'danger') {
        div.classList.add('bg-red-900/50', 'text-red-400', 'border', 'border-red-500/30');
    } else {
        div.classList.add('bg-blue-900/50', 'text-blue-400', 'border', 'border-blue-500/30');
    }
    
    div.classList.remove('hidden');
}

function handleSendCode(event) {
    event.preventDefault();
    
    const email = document.getElementById('email').value.trim();
    
    if (!email) {
        showMessage('⚠️ 請輸入信箱', 'warning');
        return;
    }
    
    const result = sendResetCode(email);
    
    if (result.success) {
        resetEmail = email;
        showMessage(result.message, 'success');
        document.getElementById('step1').classList.add('hidden');
        document.getElementById('step2').classList.remove('hidden');
        document.getElementById('code').focus();
    } else {
        showMessage(result.message, 'danger');
    }
}

function handleResetPassword() {
    const code = document.getElementById('code').value.trim();
    const newPassword = document.getElementById('new_password').value;
    
    if (!code) {
        showMessage('⚠️ 請輸入驗證碼', 'warning');
        return;
    }
    
    if (code.length !== 6) {
        showMessage('⚠️ 驗證碼為 6 位數字', 'warning');
        return;
    }
    
    if (!newPassword || newPassword.length < 4) {
        showMessage('⚠️ 密碼至少 4 個字元', 'warning');
        return;
    }
    
    // 驗證驗證碼
    const verifyResult = verifyResetCode(resetEmail, code);
    
    if (!verifyResult.success) {
        showMessage(verifyResult.message, 'danger');
        return;
    }
    
    // 重設密碼
    const resetResult = resetPassword(resetEmail, newPassword);
    
    if (resetResult.success) {
        showMessage(resetResult.message, 'success');
        setTimeout(() => {
            window.location.href = 'login.html';
        }, 1500);
    } else {
        showMessage(resetResult.message, 'danger');
    }
}

function backToStep1() {
    document.getElementById('step1').classList.remove('hidden');
    document.getElementById('step2').classList.add('hidden');
    document.getElementById('message').classList.add('hidden');
    resetEmail = '';
}
</script>

</body>
</html>
